# Déploiement monorepo : racine du repo (pas server/ seul).
# Railway → Settings → Root Directory doit être vide ou "/"

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build && cd server && npm ci && rm -rf public && cp -r ../dist public && npm run build"

[deploy]
startCommand = "node server/dist/server/src/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
